buildscript {
  ext.BrightcovePlayer = [
    kotlinVersion: "2.0.21",
    minSdkVersion: 24,
    compileSdkVersion: 36,
    brightcoveSdkVersion: "10.4.25",
    lifecycleVersion: "2.8.7"
  ]

  ext.getExtOrDefault = { prop ->
    if (rootProject.ext.has(prop)) {
      return rootProject.ext.get(prop)
    }

    return BrightcovePlayer[prop]
  }

  repositories {
    google()
    mavenCentral()
  }

  // AGP 8.7.2 resolves com.android.tools:repository:31.7.2 on this module's
  // buildscript classpath, pulling bcpkix/bcutil/bcprov-jdk18on 1.77, which
  // carry CVE-2024-29857, CVE-2024-30171, CVE-2024-30172, CVE-2024-34447,
  // CVE-2025-14813, CVE-2025-8885, CVE-2025-8916, and CVE-2026-0636. Force
  // the patched, version-aligned Bouncy Castle set onto the classpath.
  configurations.classpath {
    resolutionStrategy.force(
      "org.bouncycastle:bcpkix-jdk18on:1.85",
      "org.bouncycastle:bcprov-jdk18on:1.85",
      "org.bouncycastle:bcutil-jdk18on:1.85"
    )
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.7.2"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"
apply plugin: "com.facebook.react"

repositories {
  google()
  mavenCentral()
  maven { url "https://repo.brightcove.com/releases" }
}

// Core features are always compiled against the standard Brightcove SDK.
// Optional integrations are controlled by consumer properties because their
// sources require separate plugin artifacts and, for commercial integrations,
// customer-supplied vendor artifacts:
//   BrightcovePlayer_withAds=true (default true for standard IMA builds)
//   BrightcovePlayer_withOffline=true
//   BrightcovePlayer_withCast=true
//   BrightcovePlayer_withDai=true
//   BrightcovePlayer_withSsai=true
//   BrightcovePlayer_withThumbnail=true
//   BrightcovePlayer_withBackground=true
//   BrightcovePlayer_withOmniture=true
//   BrightcovePlayer_withFreeWheel=true
//   BrightcovePlayer_withPulse=true
def withAds = (findProperty("BrightcovePlayer_withAds") ?: "true").toBoolean()
def withOffline = (findProperty("BrightcovePlayer_withOffline") ?: "false").toBoolean()
def withCast = (findProperty("BrightcovePlayer_withCast") ?: "false").toBoolean()
def withDai = (findProperty("BrightcovePlayer_withDai") ?: "false").toBoolean()
def withSsai = (findProperty("BrightcovePlayer_withSsai") ?: "false").toBoolean()
def withThumbnail = (findProperty("BrightcovePlayer_withThumbnail") ?: "false").toBoolean()
def withBackground = (findProperty("BrightcovePlayer_withBackground") ?: "false").toBoolean()
def withOmniture = (findProperty("BrightcovePlayer_withOmniture") ?: "false").toBoolean()
def withFreeWheel = (findProperty("BrightcovePlayer_withFreeWheel") ?: "false").toBoolean()
def withPulse = (findProperty("BrightcovePlayer_withPulse") ?: "false").toBoolean()

def exclusiveAdIntegrations = [
  [name: "BrightcovePlayer_withDai", enabled: withDai],
  [name: "BrightcovePlayer_withFreeWheel", enabled: withFreeWheel],
  [name: "BrightcovePlayer_withPulse", enabled: withPulse],
].findAll { it.enabled }*.name
if (exclusiveAdIntegrations.size() > 1 || (exclusiveAdIntegrations.size() > 0 && (withAds || withSsai))) {
  throw new GradleException(
    "BrightcovePlayer: unsupported combination of ad integrations. " +
    "Only BrightcovePlayer_withAds and BrightcovePlayer_withSsai may be co-enabled."
  )
}

android {
  namespace "com.brightcove.reactnativeplayer"
  compileSdkVersion getExtOrDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrDefault("minSdkVersion")
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
    coreLibraryDesugaringEnabled true
  }
}

// An optional feature's source imports types supplied by its optional native
// dependency, so disabled features must be excluded from the Kotlin task itself.
// Applying the same filter to test compilation also excludes tests for disabled
// features rather than leaving references to absent classes.
tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
  if (!withAds) exclude("**/ads/**")
  if (!withOffline) exclude("**/offline/**")
  if (!withCast) exclude("**/cast/**")
  if (!withDai) exclude("**/dai/**")
  if (!withSsai) exclude("**/ssai/**")
  if (!withThumbnail) exclude("**/thumbnail/**")
  if (!withBackground) exclude("**/background/**")
  if (!withOmniture) exclude("**/omniture/**")
  if (!withFreeWheel) exclude("**/freewheel/**")
  if (!withPulse) exclude("**/pulse/**")
}

def generatedRegistryDir = layout.buildDirectory.dir("generated/brightcovePlayer/kotlin")
def generateFeatureRegistry = tasks.register("generateFeatureRegistry") {
  def outputDir = generatedRegistryDir
  inputs.property("withAds", withAds)
  inputs.property("withOffline", withOffline)
  inputs.property("withCast", withCast)
  inputs.property("withDai", withDai)
  inputs.property("withSsai", withSsai)
  inputs.property("withThumbnail", withThumbnail)
  inputs.property("withBackground", withBackground)
  inputs.property("withOmniture", withOmniture)
  inputs.property("withFreeWheel", withFreeWheel)
  inputs.property("withPulse", withPulse)
  outputs.dir(outputDir)
  doLast {
    def pkgDir = new File(outputDir.get().asFile, "com/brightcove/reactnativeplayer")
    pkgDir.mkdirs()
    def imports = new StringBuilder()
    def adds = new StringBuilder()

    if (withAds) {
      imports.append("import com.brightcove.reactnativeplayer.ads.AdsFeature\n")
      adds.append("    add(AdsFeature())\n")
    }
    if (withOffline) {
      imports.append("import com.brightcove.reactnativeplayer.offline.BrightcoveOfflinePlaybackFeature\n")
      adds.append("    add(BrightcoveOfflinePlaybackFeature())\n")
    }
    if (withCast) {
      imports.append("import com.brightcove.reactnativeplayer.cast.CastFeature\n")
      adds.append("    add(CastFeature())\n")
    }
    if (withDai) {
      imports.append("import com.brightcove.reactnativeplayer.dai.DaiFeature\n")
      adds.append("    add(DaiFeature())\n")
    }
    if (withSsai) {
      imports.append("import com.brightcove.reactnativeplayer.ssai.SsaiFeature\n")
      adds.append("    add(SsaiFeature())\n")
    }
    if (withThumbnail) {
      imports.append("import com.brightcove.reactnativeplayer.thumbnail.ThumbnailSeekingFeature\n")
      adds.append("    add(ThumbnailSeekingFeature())\n")
    }
    if (withBackground) {
      imports.append("import com.brightcove.reactnativeplayer.background.BackgroundPlaybackFeature\n")
      adds.append("    add(BackgroundPlaybackFeature())\n")
    }
    if (withOmniture) {
      imports.append("import com.brightcove.reactnativeplayer.omniture.OmnitureFeature\n")
      adds.append("    add(OmnitureFeature())\n")
    }
    if (withFreeWheel) {
      imports.append("import com.brightcove.reactnativeplayer.freewheel.FreeWheelFeature\n")
      adds.append("    add(FreeWheelFeature())\n")
    }
    if (withPulse) {
      imports.append("import com.brightcove.reactnativeplayer.pulse.PulseFeature\n")
      adds.append("    add(PulseFeature())\n")
    }

    def offlineModuleImport = withOffline
      ? "import com.brightcove.reactnativeplayer.offline.BrightcoveOfflinePlaybackModule\n"
      : ""
      def nativeModulesBody = withOffline
      ? "listOf(BrightcoveOfflinePlaybackModule(reactContext))"
      : "emptyList()"
      def reactModuleInfoMap = withOffline
      ? """mapOf(
      BrightcoveOfflinePlaybackModule.NAME to ReactModuleInfo(
        BrightcoveOfflinePlaybackModule.NAME,
        BrightcoveOfflinePlaybackModule::class.java.name,
        false,
        false,
        false,
        true,
      ),
    )"""
      : "emptyMap()"

    new File(pkgDir, "FeatureRegistry.kt").text = """package com.brightcove.reactnativeplayer

import com.brightcove.reactnativeplayer.audiodescription.AudioDescriptionFeature
import com.brightcove.reactnativeplayer.audiotracks.AudioTracksFeature
import com.brightcove.reactnativeplayer.buffering.BufferingFeature
import com.brightcove.reactnativeplayer.captionrendering.CaptionRenderingFeature
import com.brightcove.reactnativeplayer.captions.CaptionsFeature
import com.brightcove.reactnativeplayer.chapternavigation.ChapterNavigationFeature
import com.brightcove.reactnativeplayer.controls.ControlsFeature
import com.brightcove.reactnativeplayer.core.PlayerFeature
import com.brightcove.reactnativeplayer.drm.DrmFeature
import com.brightcove.reactnativeplayer.fullscreen.FullscreenFeature
import com.brightcove.reactnativeplayer.lifecycle.PlaybackLifecycleFeature
import com.brightcove.reactnativeplayer.live.LiveFeature
import com.brightcove.reactnativeplayer.pip.PictureInPictureFeature
import com.brightcove.reactnativeplayer.playbackevents.PlaybackEventsFeature
import com.brightcove.reactnativeplayer.playlists.PlaylistsFeature
import com.brightcove.reactnativeplayer.preloading.PreloadingFeature
import com.brightcove.reactnativeplayer.quality.QualityFeature
import com.brightcove.reactnativeplayer.sidecarcaptions.SidecarCaptionsFeature
import com.brightcove.reactnativeplayer.sourceloadingmodes.SourceLoadingModesFeature
import com.brightcove.reactnativeplayer.timedmetadata.TimedMetadataFeature
import com.brightcove.reactnativeplayer.video360.Video360Feature
${offlineModuleImport}
import com.facebook.react.bridge.NativeModule
import com.facebook.react.bridge.ReactApplicationContext
import com.facebook.react.module.model.ReactModuleInfo
import com.facebook.react.module.model.ReactModuleInfoProvider
${imports}
object FeatureRegistry {
  fun createFeatures(): List<PlayerFeature> = buildList {
    add(AudioDescriptionFeature())
    add(AudioTracksFeature())
    add(BufferingFeature())
    add(CaptionRenderingFeature())
    add(CaptionsFeature())
    add(ChapterNavigationFeature())
    add(ControlsFeature())
    add(DrmFeature())
    add(FullscreenFeature())
    add(PlaybackLifecycleFeature())
    add(LiveFeature())
    add(PictureInPictureFeature())
    add(PlaybackEventsFeature())
    add(PlaylistsFeature())
    add(PreloadingFeature())
    add(QualityFeature())
    add(SidecarCaptionsFeature())
    add(SourceLoadingModesFeature())
    add(TimedMetadataFeature())
    add(Video360Feature())
${adds}  }

  fun createNativeModules(reactContext: ReactApplicationContext): List<NativeModule> = ${nativeModulesBody}

  fun createReactModuleInfoProvider(): ReactModuleInfoProvider = ReactModuleInfoProvider {
    ${reactModuleInfoMap}
  }
}
"""
  }
}

android {
  sourceSets {
    main {
      kotlin.srcDir(generatedRegistryDir)
    }
  }
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
  dependsOn(generateFeatureRegistry)
}

dependencies {
  implementation "com.facebook.react:react-android"
  implementation "com.brightcove.player:android-sdk:${getExtOrDefault('brightcoveSdkVersion')}"
  implementation "com.brightcove.player:exoplayer2:${getExtOrDefault('brightcoveSdkVersion')}"
  implementation "androidx.lifecycle:lifecycle-common-java8:${getExtOrDefault('lifecycleVersion')}"
  coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.3"
  testImplementation "junit:junit:4.13.2"

  if (withAds) {
    implementation "com.brightcove.player:android-ima-plugin:${getExtOrDefault('brightcoveSdkVersion')}"
  }
  if (withOffline) {
    implementation "com.brightcove.player:offline-playback:${getExtOrDefault('brightcoveSdkVersion')}"
  }
  if (withCast) {
    implementation "com.brightcove.player:android-cast-plugin:${getExtOrDefault('brightcoveSdkVersion')}"
  }
  if (withDai) {
    implementation "com.brightcove.player:android-dai-plugin:${getExtOrDefault('brightcoveSdkVersion')}"
  }
  if (withSsai) {
    implementation "com.brightcove.player:android-ssai-plugin:${getExtOrDefault('brightcoveSdkVersion')}"
    implementation "com.brightcove.player:android-thumbnail-plugin:${getExtOrDefault('brightcoveSdkVersion')}"
  }
  if (withThumbnail && !withSsai) {
    implementation "com.brightcove.player:android-thumbnail-plugin:${getExtOrDefault('brightcoveSdkVersion')}"
  }
  if (withBackground) {
    implementation "com.brightcove.player:android-playback-notification-plugin:${getExtOrDefault('brightcoveSdkVersion')}"
  }
  if (withOmniture) {
    implementation "com.brightcove.player:android-omniture-plugin:${getExtOrDefault('brightcoveSdkVersion')}"
  }
  if (withFreeWheel) {
    implementation "com.brightcove.player:android-freewheel-plugin:${getExtOrDefault('brightcoveSdkVersion')}"
  }
  if (withPulse) {
    implementation "com.brightcove.player:android-pulse-plugin:${getExtOrDefault('brightcoveSdkVersion')}"
  }
}
